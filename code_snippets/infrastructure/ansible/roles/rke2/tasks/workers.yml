---

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
    recurse: yes
  loop:
    - "/etc/rancher/rke2/" 
    - "/var/lib/rancher/rke2/agent/images/"
    - "/root/rke2-artifacts/"
  tags:
    - workers

- name: Copy Worker Config file
  template:
    src: workers.cfg.j2
    dest: "/etc/rancher/rke2/config.yaml"
  tags:
    - workers

- name: Copy RKE2 Artifacts
  copy:
    src: "{{ item }}"
    dest: "/root/rke2-artifacts/{{ item }}"
  loop: "{{ rke2_artifacts }}"
  tags:
    - workers

- name: Copy Network Manager config
  copy:
    src: rke2-canal.conf
    dest: "/etc/NetworkManager/conf.d/rke2-canal.conf"
    mode: 0644
  tags:
    - workers

- name: Restart Network Manager service
  service:
    name: NetworkManager
    state: restarted
  tags:
    - workers

- name: Copy install.sh
  copy:
    src: install.sh
    dest: "/root/rke2-artifacts/install.sh"
    mode: 0755
  tags:
    - workers

- name: Copy registries.yml to configure K8 private registry for 
  template:
    src: registries.yaml.j2
    dest: "{{ rke_config_dir }}/registries.yaml"
    owner: root
    group: root
    force: yes
    mode: 0644
  tags:
   - workers

- name: Run install.sh
  shell: INSTALL_RKE2_ARTIFACT_PATH=/root/rke2-artifacts INSTALL_RKE2_TYPE=agent /root/rke2-artifacts/install.sh
  tags:
    - workers

- name: Start RKE Service
  service:
    name: rke2-agent
    state: started
    enabled: yes
  tags:
    - workers
