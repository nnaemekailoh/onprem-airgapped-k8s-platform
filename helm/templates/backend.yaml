
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: backend

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backend.serviceAccount }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        {{- if .Values.global.istio.enabled }}
        inject.istio.io/templates: "sidecar,spire"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.backend.serviceAccount }}
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          resources:
            requests:
              memory: {{ .Values.backend.resources.requests.memory }}
              cpu: {{ .Values.backend.resources.requests.cpu }}
            limits:
              memory: {{ .Values.backend.resources.limits.memory }}
              cpu: {{ .Values.backend.resources.limits.cpu }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:password@postgresql-cluster:5432/mydatabase"
          volumeMounts:
            - name: storage
              mountPath: /data
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - backend
              topologyKey: "kubernetes.io/hostname"
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: backend-storage-pvc
      initContainers:
        - name: wait-for-postgresql
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgresql-cluster 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-storage-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backend.storage.size }}
  storageClassName: {{ .Values.backend.storage.class }}
