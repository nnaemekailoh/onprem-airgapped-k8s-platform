
external-secrets:
  global:
    nodeSelector: {}
    tolerations: []
    topologySpreadConstraints: []
    affinity: {}
  replicaCount: 2
  revisionHistoryLimit: 2
  installCRDs: false
  extendedMetricLabels: true
  serviceAccount:
    create: true
    name: external-secrets-sa
    automount: true
    annotations: {}
  resources:
    limits:
      cpu: 100m
      memory: 124Mi
    requests:
      cpu: 20m
      memory: 50Mi
  serviceMonitor:
    enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  webhook:
    create: false
    certCheckInterval: 30m
    lookaheadInterval: 72h
    replicaCount: 1
    revisionHistoryLimit: 2
    certManager:
      enabled: true
      cert:
        create: true
        duration: 8760h0m0s
        renewBefore: 720h0m0s
        issuerRef:
          group: cert-manager.io
          kind: Issuer
          name: external-secrets-self-signed-issuer
    resources:
      limits:
        cpu: 500m
        memory: 124Mi
      requests:
        cpu: 30m
        memory: 50Mi
  certController:
    create: false
clusterExternalSecrets: []
