helmDefaults:
  verify: false
  enableDNS: false
  devel: false
  wait: true
  waitForJobs: true
  timeout: 300
  force: false
  atomic: true
  cleanupOnFail: true
  createNamespace: true
  skipDeps: false
  skipRefresh: false
  reuseValues: false
  deleteWait: false
  deleteTimeout: 0

# Air-gapped sites: point this at the internal Harbor and push charts there first.


repositories:
  # --- internal chart repository (air-gapped sites use only this) ---
  # - name: internal
  #   url: https://harbor.platform.internal/chartrepo/helm
  #   username: {{ requiredEnv "HELM_REPO_USERNAME" }}
  #   password: {{ requiredEnv "HELM_REPO_PASSWORD" }}
  #   skipTLSVerify: true

  # --- upstream (connected sites) ---
  - name: longhorn
    url: https://charts.longhorn.io
  - name: jetstack
    url: https://charts.jetstack.io
  - name: hashicorp
    url: https://helm.releases.hashicorp.com
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: ingress-nginx
