helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 600
  force: false
  atomic: true
  cleanupOnFail: true
  createNamespace: true


# ArgoCD after the platform is up. From here on, day-2 belongs to ArgoCD:
# policies and applications reconcile from git, not from helmfile.
#

releases:
  - name: argocd
    chart: argo/argo-cd
    version: 7.1.3
    namespace: argocd
    missingFileHandler: Info
    values:
      - values/argocd.yaml
    installed: true
    labels:
      stage: gitops
      app: argocd
