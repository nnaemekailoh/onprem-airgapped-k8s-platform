helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 300
  force: false
  atomic: true
  cleanupOnFail: true
  createNamespace: true

# Bridges Vault into Kubernetes secrets, so charts in stage 5 onward can consume them
# without secrets being committed anywhere.

releases:
  - name: external-secrets
    chart: external-secrets/external-secrets
    version: 0.9.19
    namespace: external-secrets
    missingFileHandler: Info
    values:
      - values/external-secrets.yaml
    installed: true
    labels:
      stage: external-secrets
      app: external-secrets
